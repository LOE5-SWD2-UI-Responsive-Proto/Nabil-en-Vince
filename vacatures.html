     <h1 class="titel2">Vacatures</h1>

   <form name="vacatures-form" action="vacatures.html" method="post">
        <label for="naam">Naam + Achternaam</label>
        <br>
        <input type="text" id="naam" name="naam" required>
        <br>
        <label for="email">E-mail</label>

        <br>
        <label for="tel">Telefoon</label>
        <br>
        <input type="tel" id="tel" name="tel">
        <br>
        <label for="motivatie">Motivatiebrief</label>
        <br>
        <textarea id="motivatie" name="motivatie" rows="6"></textarea> 
        <br>
        <label for="CV">Upload je CV</label>
        <br>

        <button type="submit" class="verzend-knop">Verzenden</button>
        </form>
